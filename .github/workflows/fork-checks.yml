name: fork-checks
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Divergence audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch upstream dev
        run: |
          git remote add upstream https://github.com/jetkvm/kvm.git
          git fetch --no-tags upstream dev
      - name: Audit FORK.md against upstream
        run: python3 scripts/fork/audit_divergence.py --upstream-ref upstream/dev

  tests-32bit:
    # The device's int is 32 bits; some fixes only show there (D15).
    name: Fork tests with a 32-bit int
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
      - name: Test the fork's plain Go packages on linux/386
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test ./internal/hidrpc/ ./internal/webguard/ ./internal/redact/ ./internal/websecure/ ./internal/native/refresh/ ./internal/hostlink/
      - name: Build D20's approval module on linux/386
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go vet github.com/wottpal/blitzkvm/approval/...

  vendored-approval:
    # D20: third_party/blitzkvm-approval must be BlitzKVM's approval module at
    # the commit its SOURCE names, unchanged.
    name: D20 approval module matches BlitzKVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the source commit
        id: source
        run: |
          rev=$(cat third_party/blitzkvm-approval/SOURCE)
          case "$rev" in *+changes|'?') echo "synced from uncommitted BlitzKVM ($rev): sync from a pushed commit" >&2; exit 1 ;; esac
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: wottpal/blitzkvm
          ref: ${{ steps.source.outputs.rev }}
          path: blitzkvm-src
          fetch-depth: 0
      - name: Sync and compare
        run: |
          scripts/fork/sync_approval.sh blitzkvm-src
          git diff --exit-code -- third_party/blitzkvm-approval
